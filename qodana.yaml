# https://www.jetbrains.com/help/qodana/qodana-yaml.html
version: "1.0"
# Short linter name, no image tag. The CLI shipped by JetBrains/qodana-action
# appends its own release to jetbrains/qodana-jvm-community, so a Dependabot
# bump of the action keeps the linter compatible without editing this file.
# https://www.jetbrains.com/help/qodana/configuration-reference.html#Specify+a+linter
linter: qodana-jvm-community
profile:
  # https://www.jetbrains.com/help/qodana/inspection-profiles.html
  name: qodana.recommended
# https://www.jetbrains.com/help/qodana/qodana-yaml.html#Configure+the+JDK+version
projectJDK: "21"
include:
  - name: BoundedWildcard
  - name: CheckDependencyLicenses
  - name: SerializableInnerClassHasSerialVersionUIDField
  - name: SerializableHasSerialVersionUIDField
  - name: TestOnlyProblems
