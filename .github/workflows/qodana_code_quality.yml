# https://www.jetbrains.com/help/qodana/github.html
name: Qodana
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    # Skip duplicate push-triggered runs for branches whose checks already run via
    # pull_request or merge_group. This does not disable PR/merge-queue CI.
    branches-ignore:
      - 'dependabot/**'        # Dependabot version-update PR branches
      - 'gh-readonly-queue/**' # temporary merge-queue branches; checks run on merge_group
      - 'devin/**'             # Devin session PR branches
      - 'copilot/**'           # GitHub Copilot coding agent PR branches
      - 'cursor/**'            # Cursor Cloud Agent PR branches
      - 'claude/**'            # Claude Code Action PR branches (default branch_prefix)
      - 'codex/**'             # OpenAI Codex PR branches (default branch format)

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}  # checkout PR head or merge-group head
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          args: --fail-threshold=0
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
